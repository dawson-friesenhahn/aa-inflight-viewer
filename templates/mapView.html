{% extends "base.html" %}
{% block content %}

<script id="jinja-data" type="application/json">
{
  "flight_info_route": "{{ flight_info_route }}"
}
</script>

<style>
  /* Turn the entire page into a flex column to perfectly accommodate the navbar */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden; /* Prevents the whole page from scrolling */
    margin: 0;
  }

  /* Glassmorphism Effect */
  .hud-card {
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    min-width: 110px;
  }

  /* Enable touch-dragging/scrolling on the HUD ribbon */
  .hud-scroll-container {
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
    touch-action: pan-x; /* Restrict mobile swipe to horizontal only */
  }

  .hud-scroll-container::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Edge */
  }
</style>

<!-- Outer Shell: flex-grow-1 forces this div to fill the space left below the navbar -->
<div id="map-wrapper" class="flex-grow-1 position-relative w-100 bg-dark overflow-hidden">
  
  <!-- Globe Canvas Wrapper -->
  <div id="globe" class="position-absolute top-0 start-0 w-100 h-100"></div>

  <!-- HUD Overlay Container -->
  <div class="position-absolute top-0 start-0 w-100 p-2 p-md-3 pe-none" style="z-index: 10;">
    
    <!-- Config Buttons -->
    <div class="d-flex gap-2 mb-2 pe-auto">
      <a class="btn btn-sm btn-primary shadow" data-bs-toggle="offcanvas" href="#offcanvas-config">Show Config</a>
      <a class="btn btn-sm btn-primary shadow" data-bs-toggle="offcanvas" href="#offcanvas-json">Show All JSON</a>
    </div>

    <!-- Horizontally Scrollable HUD Ribbon -->
    <div class="d-flex flex-nowrap gap-2 overflow-x-auto pb-2 hud-scroll-container">
      
      <!-- Altitude -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-altitude-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Altitude</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-altitude"></div>
      </div>

      <!-- Airspeed -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-airspeed-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Airspeed</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-airspeed"></div>
      </div>

      <!-- Groundspeed -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-groundspeed-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Groundspeed</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-groundspeed"></div>
      </div>

      <!-- Heading -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-heading-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Heading</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-heading"></div>
      </div>

      <!-- Distance Traveled -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-distanceTraveled-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Distance Traveled</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-distanceTraveled"></div>
      </div>

      <!-- Distance Remaining -->
      <div class="hud-card pe-auto bg-dark bg-opacity-75 text-white p-2 px-3 rounded border border-secondary border-opacity-50 shadow-sm flex-shrink-0" id="hud-distanceRemaining-wrapper">
        <div class="text-uppercase text-secondary fw-semibold small" style="font-size: 0.65rem; letter-spacing: 0.05em;">Distance Remaining</div>
        <div class="fw-bold font-monospace text-info fs-6 fs-md-5" id="hud-distanceRemaining"></div>
      </div>

    </div>
  </div>
</div>

<!-- Offcanvas Panels (z-index 1050 ensures they sit above the navbar and map) -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvas-json" aria-labelledby="offcanvasLabel" style="z-index: 1050;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasLabel">All JSON View</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body" id="json-view-body">
    Content for the offcanvas goes here. You can place just about any Bootstrap component or custom elements here.
  </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas-config" aria-labelledby="offcanvasLabel2" style="z-index: 1050;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasLabel2">Config</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body" id="config-view-body">
    
    


  </div>
</div>

<script src="static/dist/map_view.js" type="module"></script>

{% endblock %}
